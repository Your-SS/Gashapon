<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童家务扭蛋机 - 马卡龙色系</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f8f4ff 0%, #e6f7ff 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* 头部区域 */
        .app-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(168, 216, 234, 0.2);
            position: relative;
            overflow: hidden;
            border: 3px solid #ffc8dd;
        }
        
        .app-title {
            color: #cdb4db;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 rgba(205, 180, 219, 0.2);
        }
        
        .app-subtitle {
            color: #a2d2ff;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }
        
        .daily-info {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #ffafcc 0%, #ffc8dd 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(255, 175, 204, 0.3);
            border: 2px solid white;
        }
        
        /* 主要内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        /* 扭蛋机区域 - 马卡龙色系 */
        .gashapon-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(168, 216, 234, 0.2);
            text-align: center;
            border: 3px solid #bde0fe;
            position: relative;
        }
        
        .card-title {
            color: #a2d2ff;
            font-size: 1.8rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        /* 扭蛋机设计 - 马卡龙色系 */
        .gashapon-wrapper {
            position: relative;
            width: 320px;
            height: 420px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #ffc8dd 0%, #bde0fe 100%);
            border-radius: 25px;
            border: 6px solid #cdb4db;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(168, 216, 234, 0.3);
        }
        
        .gashapon-top {
            width: 100%;
            height: 65%;
            background: linear-gradient(135deg, #ffafcc 0%, #ffc8dd 100%);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid white;
        }
        
        .gashapon-window {
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            border: 5px solid #bde0fe;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(189, 224, 254, 0.5);
        }
        
        .gashapon-bottom {
            width: 100%;
            height: 25%;
            background: linear-gradient(135deg, #a2d2ff 0%, #cdb4db 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid white;
        }
        
        /* 可爱的扭一扭按钮设计 */
        .gashapon-button {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ffafcc 0%, #ffc8dd 100%);
            border-radius: 50%;
            border: 6px solid white;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 15px 25px rgba(255, 175, 204, 0.4),
                inset 0 5px 10px rgba(255, 255, 255, 0.5),
                inset 0 -5px 10px rgba(205, 180, 219, 0.3);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .gashapon-button::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, transparent 50%);
            border-radius: 50%;
            top: 0;
            left: 0;
        }
        
        .gashapon-button:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 
                0 20px 30px rgba(255, 175, 204, 0.6),
                inset 0 5px 10px rgba(255, 255, 255, 0.5),
                inset 0 -5px 10px rgba(205, 180, 219, 0.3);
        }
        
        .gashapon-button:active {
            transform: scale(0.95) rotate(-5deg);
        }
        
        .gashapon-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .button-icon {
            font-size: 32px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(205, 180, 219, 0.5);
        }
        
        .button-text {
            font-size: 18px;
            text-shadow: 1px 1px 3px rgba(205, 180, 219, 0.5);
        }
        
        /* 扭蛋弹出效果 - 修改为弹出后停留在页面中央 */
        .egg-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: none;
        }
        
        .egg {
            width: 180px;
            height: 220px;
            background: linear-gradient(135deg, #ffafcc 0%, #ffc8dd 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 -10px 20px rgba(205, 180, 219, 0.3);
            animation: eggPop 1s ease-out forwards;
            transform-origin: center bottom;
            border: 6px solid white;
            z-index: 101;
        }
        
        @keyframes eggPop {
            0% { 
                transform: translate(-50%, -50%) scale(0) rotate(0deg); 
                opacity: 0;
            }
            60% { 
                transform: translate(-50%, -50%) scale(1.2) rotate(180deg); 
                opacity: 1;
            }
            80% { 
                transform: translate(-50%, -50%) scale(0.95) rotate(220deg); 
            }
            100% { 
                transform: translate(-50%, -50%) scale(1) rotate(360deg); 
            }
        }
        
        .egg-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-weight: bold;
            width: 100%;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
            padding: 20px;
        }
        
        .egg-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
        }
        
        .egg-text {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .egg-points {
            font-size: 18px;
            opacity: 0.9;
        }
        
        /* 倒计时提示 */
        .countdown {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #a2d2ff;
            font-size: 16px;
            font-weight: bold;
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid #ffc8dd;
            box-shadow: 0 5px 15px rgba(162, 210, 255, 0.3);
            z-index: 102;
        }
        
        /* 半透明遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(3px);
            z-index: 99;
            display: none;
        }
        
        /* 结果展示 */
        .result-display {
            background: linear-gradient(135deg, #f8f4ff 0%, #e6f7ff 100%);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            border: 3px dashed #ffc8dd;
            display: none;
        }
        
        .result-title {
            color: #a2d2ff;
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .result-content {
            color: #cdb4db;
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        /* 文字特效 */
        .text-effect-bounce {
            animation: textBounce 1s ease;
        }
        
        @keyframes textBounce {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.3); }
            60% { transform: scale(0.9); }
        }
        
        .text-effect-rainbow {
            animation: rainbow 2s linear infinite;
            background: linear-gradient(90deg, #ffafcc, #a2d2ff, #cdb4db, #bde0fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .text-effect-sparkle {
            position: relative;
            animation: sparkle 1.5s ease;
        }
        
        .text-effect-sparkle::after {
            content: "✨";
            position: absolute;
            animation: sparkleMove 1.5s linear infinite;
        }
        
        @keyframes sparkleMove {
            0% { transform: translateX(-20px) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(20px) rotate(360deg); opacity: 0; }
        }
        
        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .control-btn {
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 3px solid white;
        }
        
        .success-btn {
            background: linear-gradient(135deg, #a2d2ff 0%, #bde0fe 100%);
            color: white;
        }
        
        .fail-btn {
            background: linear-gradient(135deg, #ffafcc 0%, #ffc8dd 100%);
            color: white;
        }
        
        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 积分显示 */
        .points-display {
            background: linear-gradient(135deg, #cdb4db 0%, #a2d2ff 100%);
            border-radius: 20px;
            padding: 25px;
            color: white;
            text-align: center;
            margin-top: 25px;
            box-shadow: 0 12px 25px rgba(162, 210, 255, 0.4);
            border: 3px solid white;
        }
        
        .points-label {
            font-size: 1.3rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .points-value {
            font-size: 3.5rem;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.2);
        }
        
        /* 信息区域 */
        .info-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(168, 216, 234, 0.2);
            border: 3px solid #ffc8dd;
        }
        
        /* 家务列表 - 动态动画 */
        .chores-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .chore-item {
            background: linear-gradient(135deg, #f8f4ff 0%, #e6f7ff 100%);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            transition: all 0.3s;
            border-left: 5px solid #ffafcc;
            animation: float 3s ease-in-out infinite;
            animation-delay: calc(var(--animation-order) * 0.2s);
            border: 2px solid white;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .chore-item:nth-child(1) { --animation-order: 1; }
        .chore-item:nth-child(2) { --animation-order: 2; }
        .chore-item:nth-child(3) { --animation-order: 3; }
        .chore-item:nth-child(4) { --animation-order: 4; }
        .chore-item:nth-child(5) { --animation-order: 5; }
        .chore-item:nth-child(6) { --animation-order: 6; }
        .chore-item:nth-child(7) { --animation-order: 7; }
        .chore-item:nth-child(8) { --animation-order: 8; }
        
        .chore-item:hover {
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 15px 30px rgba(255, 175, 204, 0.3);
        }
        
        .chore-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ffafcc 0%, #ffc8dd 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 28px;
            color: white;
            animation: bounce 2s infinite;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(255, 175, 204, 0.3);
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .chore-info {
            flex-grow: 1;
        }
        
        .chore-name {
            font-weight: bold;
            color: #a2d2ff;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .chore-points {
            color: #cdb4db;
            font-weight: bold;
            font-size: 1.3rem;
        }
        
        /* 月度统计 */
        .monthly-stats {
            background: linear-gradient(135deg, #ffc8dd 0%, #bde0fe 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            text-align: center;
            border: 3px solid white;
        }
        
        .stats-title {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
        }
        
        .stats-value {
            color: white;
            font-size: 2.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        /* 奖励区域 */
        .rewards-container {
            margin-top: 20px;
        }
        
        .reward-item {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 15px;
            border: 3px solid;
            transition: all 0.3s;
            animation: slideIn 0.5s ease-out;
            animation-delay: calc(var(--reward-order) * 0.1s);
            animation-fill-mode: both;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .reward-item:nth-child(1) { --reward-order: 1; border-color: #ffafcc; }
        .reward-item:nth-child(2) { --reward-order: 2; border-color: #a2d2ff; }
        .reward-item:nth-child(3) { --reward-order: 3; border-color: #cdb4db; }
        
        .reward-item:hover {
            transform: translateX(10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }
        
        .reward-points {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffafcc;
            margin-bottom: 8px;
        }
        
        .reward-description {
            color: #666;
            font-size: 1.1rem;
        }
        
        .redeem-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffafcc 0%, #ffc8dd 100%);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.3rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            margin-top: 10px;
            border: 3px solid white;
            box-shadow: 0 8px 20px rgba(255, 175, 204, 0.3);
        }
        
        .redeem-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 175, 204, 0.5);
        }
        
        .redeem-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 消息通知 */
        .notification {
            position: fixed;
            top: 30px;
            right: 30px;
            padding: 25px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(168, 216, 234, 0.3);
            z-index: 110;
            border-left: 8px solid;
            transform: translateX(400px);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            max-width: 350px;
            border: 2px solid #ffc8dd;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #a2d2ff;
            font-size: 1.2rem;
        }
        
        /* 动画效果 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        /* 页脚 */
        .app-footer {
            text-align: center;
            padding: 20px;
            color: #a2d2ff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1 class="app-title">🎰 儿童家务扭蛋机 🎁</h1>
            <p class="app-subtitle">一起来把家里变更美吧！</p>
            <div class="daily-info">
                <i class="fas fa-sync-alt"></i>
                <span id="daily-counter">今日剩余次数: 8次</span>
            </div>
        </header>
        
        <main class="main-content">
            <!-- 扭蛋机区域 -->
            <section class="gashapon-card">
                <h2 class="card-title">
                    <i class="fas fa-gift"></i> 家务扭蛋机
                </h2>
                
                <div class="gashapon-wrapper">
                    <div class="gashapon-top">
                        <div class="gashapon-window">
                            <!-- 扭蛋窗口 -->
                        </div>
                    </div>
                    
                    <div class="gashapon-bottom">
                        <button class="gashapon-button" id="gashapon-button">
                            <div class="button-icon">✨</div>
                            <div class="button-text">扭一扭</div>
                        </button>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="control-btn fail-btn" id="fail-btn" disabled>
                        <i class="fas fa-times-circle"></i> 还需努力
                    </button>
                    
                    <button class="control-btn success-btn" id="success-btn" disabled>
                        <i class="fas fa-check-circle"></i> 顺利达成
                    </button>
                </div>
                
                <div class="result-display" id="result-display">
                    <div class="result-title">本次家务任务</div>
                    <div class="result-content" id="result-content">等待扭蛋机抽取...</div>
                    <p>请家长验收家务完成情况后确认结果</p>
                    <div class="daily-info" style="margin-top: 10px; display: inline-flex;">
                        <span id="remaining-spins">今日剩余次数: 8次</span>
                    </div>
                </div>
                
                <div class="points-display">
                    <div class="points-label">当前总积分</div>
                    <div class="points-value pulse" id="total-points">0</div>
                </div>
            </section>
            
            <!-- 信息区域 -->
            <section class="info-card">
                <h2 class="card-title">
                    <i class="fas fa-list-check"></i> 家务任务清单
                </h2>
                
                <div class="chores-grid" id="chores-list">
                    <!-- 家务清单将通过JS生成 -->
                </div>
                
                <div class="monthly-stats">
                    <div class="stats-title">本月已赚积分</div>
                    <div class="stats-value" id="monthly-points">0</div>
                </div>
                
                <div class="rewards-container">
                    <h2 class="card-title">
                        <i class="fas fa-trophy"></i> 积分兑换奖励
                    </h2>
                    
                    <div class="reward-item">
                        <div class="reward-points">200 积分</div>
                        <div class="reward-description">玩iPad 1小时</div>
                    </div>
                    
                    <div class="reward-item">
                        <div class="reward-points">400 积分</div>
                        <div class="reward-description">贴纸或新文具</div>
                    </div>
                    
                    <div class="reward-item">
                        <div class="reward-points">600 积分</div>
                        <div class="reward-description">满足一个心愿</div>
                    </div>
                    
                    <button class="redeem-btn" id="redeem-btn">
                        <i class="fas fa-gift"></i> 兑换奖励
                    </button>
                </div>
            </section>
        </main>
        
        
        <!-- 扭蛋弹出层 -->
        <div class="overlay" id="overlay"></div>
        <div class="egg-container" id="egg-container">
            <div class="egg">
                <div class="egg-content">
                    <div class="egg-icon" id="egg-icon">🎁</div>
                    <div class="egg-text" id="egg-text">家务任务</div>
                    <div class="egg-points" id="egg-points">0积分</div>
                </div>
            </div>
            <div class="countdown" id="countdown">5秒后消失...</div>
        </div>
        
        <!-- 消息通知 -->
        <div class="notification" id="notification">
            <div class="notification-title" id="notification-title">提示</div>
            <div id="notification-message">消息内容</div>
        </div>
    </div>

    <script>
        // 家务数据 - 每个家务的积分和图标
        const chores = [
            { 
                name: "整理玩具", 
                points: 3, 
                icon: "fa-puzzle-piece", 
                color: "#FFAFCC",
                emoji: "🧩",
                effect: "text-effect-bounce"
            },
            { 
                name: "收拾书包", 
                points: 3, 
                icon: "fa-school", 
                color: "#A2D2FF",
                emoji: "🎒",
                effect: "text-effect-rainbow"
            },
            { 
                name: "喂小宠物", 
                points: 2, 
                icon: "fa-paw", 
                color: "#CDB4DB",
                emoji: "🐾",
                effect: "text-effect-sparkle"
            },
            { 
                name: "整理清洁书桌", 
                points: 3, 
                icon: "fa-table", 
                color: "#BDE0FE",
                emoji: "📚",
                effect: "text-effect-bounce"
            },
            { 
                name: "给植物浇水", 
                points: 3, 
                icon: "fa-seedling", 
                color: "#FFC8DD",
                emoji: "🌱",
                effect: "text-effect-rainbow"
            },
            { 
                name: "摆放碗筷", 
                points: 2, 
                icon: "fa-utensils", 
                color: "#A2D2FF",
                emoji: "🥢",
                effect: "text-effect-sparkle"
            },
            { 
                name: "叠小衣服", 
                points: 3, 
                icon: "fa-shirt", 
                color: "#CDB4DB",
                emoji: "👕",
                effect: "text-effect-bounce"
            },
            { 
                name: "扫扫地", 
                points: 5, 
                icon: "fa-broom", 
                color: "#FFAFCC",
                emoji: "🧹",
                effect: "text-effect-rainbow"
            }
        ];

        // 奖励数据
        const rewards = [
            { points: 200, description: "玩iPad 1小时" },
            { points: 400, description: "贴纸或者新文具" },
            { points: 600, description: "满足一个心愿" }
        ];

        // 状态变量
        let totalPoints = 0;
        let monthlyPoints = 0;
        let dailySpins = 8;
        const maxDailySpins = 8;
        let isSpinning = false;
        let currentChore = null;
        let countdownTimer = null;

        // DOM加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initChoresList();
            loadFromStorage();
            updateUI();
            
            // 事件监听
            document.getElementById('gashapon-button').addEventListener('click', spinGashapon);
            document.getElementById('success-btn').addEventListener('click', confirmSuccess);
            document.getElementById('fail-btn').addEventListener('click', confirmFail);
            document.getElementById('redeem-btn').addEventListener('click', redeemReward);
        });

        // 初始化家务列表
        function initChoresList() {
            const choresList = document.getElementById('chores-list');
            
            chores.forEach((chore, index) => {
                const item = document.createElement('div');
                item.className = 'chore-item';
                item.style.animationDelay = `${index * 0.2}s`;
                item.innerHTML = `
                    <div class="chore-icon">
                        <i class="fas ${chore.icon}"></i>
                    </div>
                    <div class="chore-info">
                        <div class="chore-name">${chore.name}</div>
                        <div class="chore-points">${chore.points} 积分</div>
                    </div>
                `;
                
                choresList.appendChild(item);
            });
        }

        // 转动扭蛋机
        function spinGashapon() {
            if (isSpinning || dailySpins <= 0) return;
            
            isSpinning = true;
            dailySpins--;
            
            // 禁用按钮
            document.getElementById('gashapon-button').disabled = true;
            document.getElementById('gashapon-button').style.cursor = 'not-allowed';
            
            // 隐藏结果区域
            document.getElementById('result-display').style.display = 'none';
            
            // 随机选择家务
            const randomIndex = Math.floor(Math.random() * chores.length);
            currentChore = chores[randomIndex];
            
            // 显示遮罩层
            document.getElementById('overlay').style.display = 'block';
            
            // 设置扭蛋内容
            const eggIcon = document.getElementById('egg-icon');
            const eggText = document.getElementById('egg-text');
            const eggPoints = document.getElementById('egg-points');
            
            eggIcon.textContent = currentChore.emoji;
            eggText.textContent = currentChore.name;
            eggPoints.textContent = `${currentChore.points}积分`;
            
            // 添加特效
            eggText.className = 'egg-text ' + currentChore.effect;
            
            // 显示扭蛋
            const eggContainer = document.getElementById('egg-container');
            eggContainer.style.display = 'block';
            
            // 开始倒计时
            startCountdown(5);
            
            // 更新UI
            updateUI();
            saveToStorage();
        }

        // 开始倒计时
        function startCountdown(seconds) {
            const countdownElement = document.getElementById('countdown');
            let remaining = seconds;
            
            // 更新倒计时显示
            countdownElement.textContent = `${remaining}秒后消失...`;
            
            // 设置倒计时
            countdownTimer = setInterval(() => {
                remaining--;
                countdownElement.textContent = `${remaining}秒后消失...`;
                
                if (remaining <= 0) {
                    // 倒计时结束，隐藏扭蛋
                    clearInterval(countdownTimer);
                    hideEgg();
                }
            }, 1000);
        }

        // 隐藏扭蛋
        function hideEgg() {
            // 清除倒计时
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            
            // 隐藏扭蛋和遮罩
            document.getElementById('egg-container').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            
            // 显示结果区域
            const resultContent = document.getElementById('result-content');
            resultContent.textContent = `${currentChore.name} (${currentChore.points}积分)`;
            resultContent.className = 'result-content ' + currentChore.effect;
            document.getElementById('result-display').style.display = 'block';
            
            // 启用结果按钮
            document.getElementById('success-btn').disabled = false;
            document.getElementById('fail-btn').disabled = false;
            
            // 显示通知
            showNotification('家务任务已抽取！', `请完成：${currentChore.name}`, 'info', currentChore.effect);
            
            isSpinning = false;
            
            // 如果次数用完，禁用扭蛋按钮
            if (dailySpins <= 0) {
                document.getElementById('gashapon-button').disabled = true;
                showNotification('今天的次数用完啦！', '明天再来继续努力吧！', 'info');
            } else {
                document.getElementById('gashapon-button').disabled = false;
                document.getElementById('gashapon-button').style.cursor = 'pointer';
            }
        }

        // 确认家务完成成功
        function confirmSuccess() {
            if (!currentChore) return;
            
            totalPoints += currentChore.points;
            monthlyPoints += currentChore.points;
            
            showNotification(
                '太棒了！',
                `你完成了 ${currentChore.name}，获得了 ${currentChore.points} 积分！`,
                'success',
                currentChore.effect
            );
            
            resetResult();
            updateUI();
            saveToStorage();
        }

        // 确认家务完成失败
        function confirmFail() {
            if (!currentChore) return;
            
            showNotification(
                '下次要更努力哦！',
                `${currentChore.name} 完成得不够好，这次不能获得积分。`,
                'warning',
                currentChore.effect
            );
            
            resetResult();
        }

        // 重置结果状态
        function resetResult() {
            currentChore = null;
            document.getElementById('success-btn').disabled = true;
            document.getElementById('fail-btn').disabled = true;
            document.getElementById('result-display').style.display = 'none';
            
            // 重置结果文字特效
            document.getElementById('result-content').className = 'result-content';
        }

        // 兑换奖励
        function redeemReward() {
            // 找到可兑换的最高奖励
            let redeemableReward = null;
            for (let i = rewards.length - 1; i >= 0; i--) {
                if (monthlyPoints >= rewards[i].points) {
                    redeemableReward = rewards[i];
                    break;
                }
            }
            
            if (!redeemableReward) {
                showNotification('积分不足', '继续努力完成家务，攒够积分来兑换奖励吧！', 'info');
                return;
            }
            
            if (confirm(`确定要兑换 "${redeemableReward.description}" 吗？这将花费 ${redeemableReward.points} 积分。`)) {
                monthlyPoints -= redeemableReward.points;
                
                showNotification(
                    '兑换成功！',
                    `你成功兑换了：${redeemableReward.description}。`,
                    'success'
                );
                
                updateUI();
                saveToStorage();
            }
        }

        // 更新界面
        function updateUI() {
            // 更新积分显示
            document.getElementById('total-points').textContent = totalPoints;
            document.getElementById('monthly-points').textContent = monthlyPoints;
            
            // 更新每日次数
            document.getElementById('daily-counter').textContent = `今日剩余次数: ${dailySpins}次`;
            document.getElementById('remaining-spins').textContent = `今日剩余次数: ${dailySpins}次`;
            
            // 更新兑换按钮状态
            const redeemBtn = document.getElementById('redeem-btn');
            redeemBtn.disabled = monthlyPoints < rewards[0].points;
            
            // 添加积分脉冲动画
            const pointsElement = document.getElementById('total-points');
            pointsElement.classList.remove('pulse');
            void pointsElement.offsetWidth; // 触发重绘
            pointsElement.classList.add('pulse');
        }

        // 显示通知
        function showNotification(title, message, type, effect = '') {
            const notification = document.getElementById('notification');
            const titleElement = document.getElementById('notification-title');
            const messageElement = document.getElementById('notification-message');
            
            // 设置通知样式
            notification.style.borderLeftColor = 
                type === 'success' ? '#A2D2FF' : 
                type === 'warning' ? '#FFAFCC' : '#CDB4DB';
            
            titleElement.textContent = title;
            messageElement.textContent = message;
            messageElement.className = effect;
            
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 保存到本地存储
        function saveToStorage() {
            const today = new Date().toDateString();
            const data = {
                totalPoints,
                monthlyPoints,
                dailySpins,
                lastSpinDate: today
            };
            
            localStorage.setItem('kidChoreGashaponMacaron', JSON.stringify(data));
        }

        // 从本地存储加载
        function loadFromStorage() {
            const savedData = localStorage.getItem('kidChoreGashaponMacaron');
            
            if (savedData) {
                const data = JSON.parse(savedData);
                const today = new Date().toDateString();
                
                totalPoints = data.totalPoints || 0;
                monthlyPoints = data.monthlyPoints || 0;
                
                // 如果最后旋转日期不是今天，重置每日旋转次数
                if (data.lastSpinDate !== today) {
                    dailySpins = maxDailySpins;
                } else {
                    dailySpins = data.dailySpins || maxDailySpins;
                }
                
                // 如果今天是每月第一天，重置月度积分
                const todayDate = new Date();
                if (todayDate.getDate() === 1) {
                    monthlyPoints = 0;
                }
            }
        }
    </script>
</body>
</html>
